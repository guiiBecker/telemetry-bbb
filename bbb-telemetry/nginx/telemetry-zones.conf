# Rate-limit zones for the /api/telemetry location (installed by bbb-telemetry into conf.d)
# Per session: ~2 requests a minute is normal, 10 r/m leaves room for incident logs
limit_req_zone $http_x_session_token zone=bbb_telemetry_session:10m rate=10r/m;
# Per IP: a classroom behind one NAT sends ~4 r/m per participant
limit_req_zone $binary_remote_addr zone=bbb_telemetry_ip:10m rate=300r/m;
